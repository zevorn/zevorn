# RISC-V 64-bit Software MMU Configuration
# Target: riscv64-softmmu

[general]
target_arch = riscv64
mode = softmmu
endianness = little

[features]
# CPU features
enable_vector_extension = yes
enable_compressed_instructions = yes
enable_atomic_extension = yes
enable_float_extension = yes
enable_double_extension = yes

# MMU features
page_size = 4096
enable_sv39 = yes
enable_sv48 = yes
enable_sv57 = no

[memory]
# Memory configuration
default_ram_size = 2G
max_ram_size = 16G

[devices]
# Device emulation
enable_virtio = yes
enable_pci = yes
enable_uart = yes

[debug]
# Debug options
enable_gdb_stub = yes
enable_trace = yes
log_level = info
